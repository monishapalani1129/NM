<body class="app-body">
  <div class="app-frame">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard" aria-label="EduGenie dashboard"><span class="brand-symbol">e</span><span>edugenie<span class="brand-period">.</span></span></a>
      <p class="sidebar-caption">YOUR LEARNING SPACE</p>
